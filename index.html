<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checklist voyage</title>
  <meta name="theme-color" content="#69C3EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Checklist voyage">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json?v=2.11">
  <link rel="icon" href="./icon.svg?v=2.11" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png?v=2.11">
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.2/dist/pocketbase.umd.js"></script>
  <link rel="stylesheet" href="./styles.css?v=2.11">
</head>
<body>
  <div class="app">
    <div class="shell">
      <header class="topbar">
        <div class="topbar-inner">
          <button class="brand" type="button" onclick="goHome()" title="Retour à l'accueil">
            <div class="brand-mark" aria-hidden="true">
              <img class="brand-icon" src="./icon.svg" alt="">
            </div>
            <div class="brand-title">
              <h1>Checklist voyage <span class="badge blue">2.11</span></h1>
              <div class="headline-meta" id="headerMeta">Préparez vos sacs sans prise de tête</div>
            </div>
          </button>
          <div class="topbar-actions">
            <details class="voyage-menu settings-menu" id="settingsMenu">
              <summary class="icon-btn" title="Paramètres">&#9881;</summary>
              <div class="voyage-menu-panel">
                <button class="menu-item" type="button" onclick="openCustomCategories()">Gérer les catégories personnalisées</button>
                <button class="menu-item" type="button" onclick="openInstallation()">Installer l'application</button>
                <button class="menu-item" type="button" onclick="exportBackup()">Exporter une sauvegarde</button>
                <button class="menu-item" type="button" onclick="openBackupImport()">Importer une sauvegarde</button>
              </div>
            </details>
            <input id="backupImportInput" type="file" accept="application/json,.json" hidden onchange="importBackupFile(event)">
          </div>
        </div>
      </header>

      <main class="content" id="content"></main>
      <nav class="bottom-nav" aria-label="Navigation principale" id="bottomNav"></nav>
    </div>
  </div>

  <div class="sheet-backdrop" id="voyageSheet" onclick="closeSheetOnBackdrop(event, 'voyageSheet')">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="voyageSheetTitle">
      <div class="sheet-head">
        <h2 id="voyageSheetTitle">Nouveau voyage</h2>
        <button class="icon-btn" type="button" onclick="closeSheet('voyageSheet')" title="Fermer">×</button>
      </div>
      <form class="grid section" id="voyageForm" onsubmit="saveVoyageSheet(event)">
        <div class="field">
          <label for="voyageLocation">Destination</label>
          <input id="voyageLocation" name="location" autocomplete="off" placeholder="Rechercher une destination" oninput="searchDestination(this.value)" onfocus="showDestinationSuggestions()">
          <div class="suggestions" id="destinationSuggestions"></div>
        </div>
        <div class="field">
          <label for="voyageName">Nom du voyage <span class="muted">(facultatif)</span></label>
          <input id="voyageName" name="tripName" autocomplete="off" placeholder="Par défaut : la destination">
        </div>
        <div class="field">
          <label>Dates du voyage</label>
          <button class="date-input" id="voyageDateButton" type="button" onclick="openDatePicker()">Choisir les dates</button>
          <div class="calendar" id="rangeCalendar"></div>
        </div>
        <div class="field" id="voyageParticipantsBlock">
          <label>Participants</label>
          <div class="template-picks" id="voyageParticipantChoices"></div>
        </div>
        <div class="field">
          <label>Transport</label>
          <div class="choice-grid">
            <label class="choice"><input type="checkbox" name="transport" value="avion">Avion</label>
            <label class="choice"><input type="checkbox" name="transport" value="train">Train</label>
            <label class="choice"><input type="checkbox" name="transport" value="voiture">Voiture</label>
            <label class="choice"><input type="checkbox" name="transport" value="bus">Bus</label>
            <label class="choice"><input type="checkbox" name="transport" value="bateau">Bateau</label>
          </div>
        </div>
        <div class="field">
          <label>Logement</label>
          <div class="choice-grid">
            <label class="choice"><input type="checkbox" name="lodging" value="hotel">Hôtel</label>
            <label class="choice"><input type="checkbox" name="lodging" value="camping">Camping</label>
            <label class="choice"><input type="checkbox" name="lodging" value="famille">Famille</label>
            <label class="choice"><input type="checkbox" name="lodging" value="location">Location</label>
          </div>
        </div>
        <div class="button-row">
          <button class="btn blue full" id="voyageSubmitButton" type="submit">Créer</button>
        </div>
      </form>
    </section>
  </div>

  <div class="sheet-backdrop" id="joinVoyageSheet" onclick="closeSheetOnBackdrop(event, 'joinVoyageSheet')">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="joinVoyageSheetTitle">
      <div class="sheet-head">
        <h2 id="joinVoyageSheetTitle">Ajouter via un code</h2>
        <button class="icon-btn" type="button" onclick="closeSheet('joinVoyageSheet')" title="Fermer">&times;</button>
      </div>
      <form class="grid section" id="joinForm" onsubmit="joinVoyage(event)">
        <div class="field">
          <label for="sheetJoinCode">Code du voyage</label>
          <input id="sheetJoinCode" autocomplete="off" inputmode="text" maxlength="8" placeholder="Ex. BRET26, ROME26, SKI227">
        </div>
        <button class="btn green full" type="submit">Ajouter ce voyage</button>
      </form>
    </section>
  </div>

  <div class="sheet-backdrop" id="joinQuickListSheet" onclick="closeSheetOnBackdrop(event, 'joinQuickListSheet')">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="joinQuickListSheetTitle">
      <div class="sheet-head">
        <h2 id="joinQuickListSheetTitle">Ajouter via un code</h2>
        <button class="icon-btn" type="button" onclick="closeSheet('joinQuickListSheet')" title="Fermer">&times;</button>
      </div>
      <form class="grid section" id="joinQuickListForm" onsubmit="joinQuickList(event)">
        <div class="field">
          <label for="sheetQuickListCode">Code de la liste rapide</label>
          <input id="sheetQuickListCode" autocomplete="off" inputmode="text" maxlength="8" placeholder="Code">
        </div>
        <button class="btn green full" type="submit">Ajouter cette liste</button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Code copié</div>

  <div class="sheet-backdrop" id="categorySheet" onclick="closeSheetOnBackdrop(event, 'categorySheet')">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="categorySheetTitle">
      <div class="sheet-head">
        <h2 id="categorySheetTitle">Ajouter un membre</h2>
        <button class="icon-btn" type="button" onclick="closeSheet('categorySheet')" title="Fermer">&times;</button>
      </div>
      <form class="grid section" onsubmit="saveMemberSheet(event)">
        <div class="field">
          <label for="memberListGroup">Liste</label>
          <select id="memberListGroup" onchange="renderMemberTemplateGroups()">
            <option value="general">Général</option>
            <option value="family" selected>Famille</option>
          </select>
        </div>
        <div class="field">
          <label for="memberTemplateGroup">Membre</label>
          <select id="memberTemplateGroup" onchange="selectMemberTemplateGroup(this.value)"></select>
        </div>
        <div class="grid" id="categoryTemplateChoices"></div>
        <button class="btn blue full" type="submit">Ajouter</button>
      </form>
    </section>
  </div>

  <div class="sheet-backdrop" id="iconSheet" onclick="closeSheetOnBackdrop(event, 'iconSheet')">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="iconSheetTitle">
      <div class="sheet-head">
        <h2 id="iconSheetTitle">Modifier l'icône</h2>
        <button class="icon-btn" type="button" onclick="closeSheet('iconSheet')" title="Fermer">&times;</button>
      </div>
      <div class="icon-picker-grid" id="iconChoices"></div>
    </section>
  </div>

  <div class="sheet-backdrop" id="customCategoryMoveSheet" onclick="closeSheetOnBackdrop(event, 'customCategoryMoveSheet')">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="customCategoryMoveTitle">
      <div class="sheet-head">
        <h2 id="customCategoryMoveTitle">Déplacer une catégorie</h2>
        <button class="icon-btn" type="button" onclick="closeSheet('customCategoryMoveSheet')" title="Fermer">&times;</button>
      </div>
      <form class="grid section" onsubmit="saveCustomCategoryMemberChange(event)">
        <div class="field">
          <label for="customCategoryTargetMember">Nouveau membre</label>
          <select id="customCategoryTargetMember"></select>
        </div>
        <button class="btn blue full" id="customCategoryMoveSubmit" type="submit">Déplacer</button>
      </form>
    </section>
  </div>

  <script src="./app.js?v=2.11"></script>
</body>
</html>
